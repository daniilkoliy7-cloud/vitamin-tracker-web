<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#34C759" />
  <link rel="manifest" href="./assets/manifest-CkdqvuH2.webmanifest" />
  <link rel="icon" href="data:," />
  <title>Vitamin Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #34C759;
      --green-dim: #2db84e;
      --bg: #f7f9fa;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8b8e93;
      --border: #e4e6ea;
      --radius: 16px;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --font: -apple-system, system-ui, "Inter", sans-serif;
    }
    html, body { font-family: var(--font); background: var(--bg); color: var(--text); }
    body { padding: 0 0 72px; min-height: 100vh; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 8px 0; justify-content: space-around; }
    .nav a { flex: 1; text-align: center; padding: 10px; font-size: 13px; color: var(--muted); text-decoration: none; }
    .nav a.active { color: var(--green); font-weight: 600; }
    .page { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
    .page.active { display: block; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .badge.active { background: var(--green-dim); color: #fff; }
    .badge.paused { background: #f59e0b; color: #fff; }
    .badge.archived { background: #9ca3af; color: #fff; }
    .card { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card h3 { font-size: 16px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 10px; }
    .btn { padding: 10px 18px; border: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; background: var(--green); color: #fff; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
    .btn-danger { background: #ef4444; color: #fff; }
    input, select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; }
    input:focus { border-color: var(--green); }
    .mt-2 { margin-top: 8px; }
    .gap { gap: 8px; }
    .flex { display: flex; }
    .flex-1 { flex: 1; }
    .text-muted { color: var(--muted); font-size: 13px; }
    .text-green { color: var(--green); }
    .text-center { text-align: center; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
    .pill.taken { background: #d1fae5; color: #065f46; }
    .pill.missed { background: #fee2e2; color: #991b1b; }
    .pill.pending { background: #f3f4f6; color: #6b7280; }
    .progress-ring { width: 48px; height: 48px; position: relative; }
    .progress-ring svg { width: 48px; height: 48px; }
    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1c1c1e; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; z-index: 999; opacity: 0; transition: 0.3s; }
    .toast.show { opacity: 1; }
    @media(prefers-color-scheme:dark) {
      :root { --bg: #1c1c1e; --card: #2a2a2e; --text: #f0f0f2; --muted: #9ca3af; --border: #3a3a3e; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BkKRa6uk.js"></script>
</head>
<body>
  <div id="app">
    <div class="toast" id="toast"></div>
    
    <!-- Pages -->
    <div class="page active" id="page-today">
      <h1>📅 <span data-i18n="today">Сегодня</span></h1>
      <div id="today-list"></div>
      <div id="today-empty" style="display:none" class="text-center mt-2">
        <p style="font-size:48px;margin-top:40px">💊</p>
        <p data-i18n="no-courses" class="text-muted mt-2">Нет активных курсов</p>
        <button class="btn mt-2" onclick="navigate('add')" data-i18n="add-course">Добавить курс</button>
      </div>
    </div>

    <div class="page" id="page-courses">
      <h1>📋 <span data-i18n="courses">Курсы</span></h1>
      <div id="courses-list"></div>
    </div>

    <div class="page" id="page-add">
      <h1>➕ <span data-i18n="add-course">Добавить курс</span></h1>
      <div class="card">
        <input id="add-name" placeholder="Название" data-i18n-placeholder="course-name" />
        <input id="add-dose" placeholder="Дозировка (опц.)" data-i18n-placeholder="dosage-opt" class="mt-2" />
        <div class="flex gap mt-2">
          <div class="flex-1"><label class="text-muted" data-i18n="intakes-per-day">Приёмов в день</label><input id="add-intakes" type="number" min="1" max="6" value="2" /></div>
          <div class="flex-1"><label class="text-muted" data-i18n="duration">Длительность (дн)</label><input id="add-duration" type="number" min="1" max="365" value="30" /></div>
        </div>
        <div id="add-times" class="mt-2"></div>
        <button class="btn mt-2" onclick="saveCourse()" data-i18n="save">Сохранить</button>
        <button class="btn-outline btn-sm mt-2" onclick="navigate('today')" data-i18n="cancel">Отмена</button>
      </div>
    </div>

    <div class="page" id="page-detail">
      <h1 id="detail-title">📄</h1>
      <div id="detail-content"></div>
    </div>

    <!-- Navbar -->
    <nav class="nav">
      <a href="#" onclick="navigate('today')" class="active" data-i18n="today">Сегодня</a>
      <a href="#" onclick="navigate('courses')" data-i18n="courses">Курсы</a>
      <a href="#" onclick="navigate('add')" data-i18n="add">Добавить</a>
    </nav>
  </div>
</body>
</html>
